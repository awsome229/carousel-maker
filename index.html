<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seam">
<meta name="theme-color" content="#1c1d1f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Seam</title>
<style>
/* Tokens. Graphite ground so photos read true; frosted surfaces only on controls; one accent for action + selection. */
:root{
  color-scheme:dark;
  --ground:#1c1d1f; --surface:rgba(42,43,46,.82); --solid:#2a2b2e; --fill:rgba(255,255,255,.09); --fill-2:rgba(255,255,255,.16);
  --text:#f2f2f0; --text-2:rgba(242,242,240,.68); --hair:rgba(255,255,255,.1);
  --acc:#4c8dff; --danger:#ff6b5e; --sel:#f2f2f0; --sel-text:#1c1d1f;
  --t-cap:12px; --t-body:15px; --t-title:17px; --t-hero:28px;   /* the whole type scale */
  --r-s:8px; --r-m:14px; --r-l:28px;                            /* the whole radius scale */
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);font:var(--t-body)/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Buttons: two styles only. */
.btn{min-height:44px;padding:0 18px;border-radius:var(--r-m);background:var(--acc);color:#fff;font-weight:600;font-size:var(--t-title);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.quiet{background:var(--fill);color:var(--text)}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{width:44px;padding:0;background:none}
.btn.icon:disabled{opacity:.3}

/* Segmented control: used for every either/or choice. */
.seg{display:flex;background:var(--fill);border-radius:var(--r-m);padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:38px;padding:0 12px;border-radius:11px;font-weight:600;color:var(--text-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--sel-text)}

header{background:var(--ground);position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:4px;padding:calc(14px + env(safe-area-inset-top)) 8px 6px}
header .seg{margin:0 auto;flex:0 1 auto}
header .seg button{min-height:34px;padding:0 13px}
header .btn:not(.icon){min-height:38px;font-size:var(--t-body)}

main{flex:1;position:relative;min-height:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:10px;top:8px;display:flex;background:var(--surface);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--r-m)}
.zoom button{min-width:40px;min-height:36px;font-weight:600;color:var(--text-2)}
@media (pointer:coarse){.zoom{display:none}}
#count{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--surface);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--r-m);padding:4px 10px;font-size:var(--t-cap);font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);pointer-events:none}
#empty{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#empty h1{font-size:var(--t-hero);font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.15;max-width:12em}
#empty[hidden]{display:none}
#empty p{margin:0;color:var(--text-2);max-width:26em}

nav#tray{background:var(--surface);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;min-height:72px;position:relative;z-index:3}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;max-width:84px;min-height:56px;border-radius:var(--r-m);font-size:var(--t-cap);font-weight:500;color:var(--text-2)}
.tool svg{color:var(--text)}
.tool:active,.tool.on{background:var(--fill)}
.tool.danger,.tool.danger svg{color:var(--danger)}
.croprow{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;padding:0 6px;font-weight:600}
.croprow input{flex:1}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--hair);padding:0 16px calc(18px + env(safe-area-inset-bottom));max-height:58dvh;overflow:auto;transform:translateY(calc(100% + 24px));visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
#sheet.open{transform:none;visibility:visible;transition:transform .38s var(--ease)}
#sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--fill-2);margin:8px auto 0}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 0 10px}
.sh-head b{grid-column:2;font-size:var(--t-title)}
.sh-head .done{grid-column:3;justify-self:end;min-height:44px;padding:0 4px;font-weight:600;color:var(--acc);font-size:var(--t-title)}
.sec{color:var(--text-2);margin:16px 0 8px}
.row{display:flex;align-items:center;gap:12px;margin:12px 0}
.row label{width:84px;color:var(--text-2);flex:none}
.row input[type=range]{flex:1}
.val{min-width:56px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cap{color:var(--text-2);font-size:var(--t-cap);margin:8px 2px 0}
input[type=range]{accent-color:var(--acc);height:44px;margin:0}
.swatches{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.swatches::-webkit-scrollbar{display:none}
.sw{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.sw i{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sw.on i{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--sel)}
.sw.custom{position:relative}
.sw.custom i{background:conic-gradient(#ff5e5e,#ffd25e,#7cff6b,#5ee7ff,#6b7bff,#ff6bf0,#ff5e5e)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.preset{flex:none;width:52px;height:52px;border-radius:var(--r-m);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
textarea{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--fill);border:0;border-radius:var(--r-m);padding:12px;resize:vertical;min-height:76px;user-select:text;-webkit-user-select:text}
.stepper{display:flex;align-items:center;gap:16px;font-size:var(--t-hero);font-weight:700;font-variant-numeric:tabular-nums}
.stepper .btn{width:48px;padding:0;font-size:var(--t-hero);font-weight:400}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.list button{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 4px;border-bottom:1px solid var(--hair);font-size:var(--t-title)}
.list button:last-child{border-bottom:0}
.list button.danger{color:var(--danger)}

.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
@media (min-width:600px){.modal{align-items:center;padding:16px}}
.panel{background:var(--solid);border-radius:var(--r-l) var(--r-l) 0 0;width:min(560px,100%);max-height:92dvh;overflow:auto;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.panel{border-radius:var(--r-l)}}
.panel h2{margin:0;font-size:var(--t-hero);letter-spacing:-.01em}
.panel .cap{margin:4px 0 0;font-size:var(--t-body)}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 16px}
.thumbs::-webkit-scrollbar{display:none}
.thumbs > *{flex:none;width:92px;border-radius:var(--r-s);overflow:hidden;background:var(--fill);position:relative;display:block}
.thumbs canvas,.thumbs img,.thumbs video{width:100%;display:block}
.thumbs span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 6px;font-size:var(--t-cap);font-variant-numeric:tabular-nums}
.warn{margin:14px 0 0;color:var(--danger)}
.prog{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin:18px 0 6px}
.prog div{height:100%;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .2s linear}

.phone{background:#fff;color:#111;border-radius:var(--r-l);width:min(400px,100%);overflow:hidden;margin:auto 16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.igbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;font-weight:600}
.igbar i{width:28px;height:28px;border-radius:50%;background:#d9d6cf}
.igbar .btn.icon{margin-left:auto;color:#111}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car canvas{flex:0 0 100%;width:100%;scroll-snap-align:start;display:block}
.dots{display:flex;justify-content:center;gap:5px;padding:12px 0 16px}
.dots b{width:6px;height:6px;border-radius:50%;background:#cfccc4}
.dots b.on{background:var(--acc)}
.count{position:absolute;margin:10px;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:var(--t-cap);border-radius:10px;padding:2px 8px;font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translate(-50%,-12px);background:var(--sel);color:var(--sel-text);padding:10px 16px;border-radius:var(--r-m);font-weight:600;opacity:0;transition:opacity .2s,transform .3s var(--ease);pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#update{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#update[hidden]{display:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#vids{position:fixed;width:2px;height:2px;opacity:.01;pointer-events:none;overflow:hidden;left:0;top:0}
@media (prefers-reduced-motion:reduce){#sheet,#toast{transition:none}}
</style>
</head>
<body>
<header>
  <button class="btn icon" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="btn icon" id="redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0 0 12h3"/></svg></button>
  <div class="seg ratios" role="group" aria-label="Post shape">
    <button data-r="1:1">1:1</button><button data-r="4:5">4:5</button><button data-r="3:4">3:4</button>
  </div>
  <button class="btn icon" id="previewBtn" aria-label="Preview post"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
  <button class="btn" id="exportBtn">Export</button>
</header>
<main id="stage">
  <canvas id="cv" aria-label="Carousel canvas"></canvas>
  <div class="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zfit">Fit</button><button id="zin" aria-label="Zoom in">+</button></div>
  <div id="count" aria-live="polite"></div>
  <div id="empty"><h1>Make a carousel</h1><p>Photos and videos go one per slide. Drag them across the cut marks to run one picture over two slides.</p><button class="btn" id="emptyAdd">Add photos and videos</button></div>
</main>
<nav id="tray"></nav>
<div id="sheet" role="dialog" aria-modal="false"></div>
<div class="modal" id="modal"></div>
<div id="toast" role="status"></div>
<button class="btn" id="update" hidden>New version. Tap to update</button>
<div id="vids"></div>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>
<script>
'use strict';
// Instagram feed max is 1080px wide; larger uploads get downscaled, so export exactly this.
const RATIOS = {'1:1':[1080,1080],'4:5':[1080,1350],'3:4':[1080,1440]};
const MAX_SLIDES = 20, MAX_VIDEO_S = 60, FPS = 30;
const FONTS = {
  Sans:'-apple-system,"Helvetica Neue",Arial,sans-serif',
  Serif:'"New York",Georgia,"Times New Roman",serif',
  Rounded:'ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",sans-serif',
  Condensed:'"Avenir Next Condensed","Arial Narrow",sans-serif',
  Mono:'ui-monospace,Menlo,Consolas,monospace',
  Hand:'"Marker Felt","Bradley Hand","Comic Sans MS",cursive'
};
const SWATCH = ['#111111','#ffffff','#f2ede4','#e94f37','#f6c445','#3c8d5f','#2f6fdf','#8e5bd8','#f08bb5'];
const BG_PRESETS = [
  {type:'solid',c1:'#ffffff',c2:'#ffffff'},{type:'solid',c1:'#111111',c2:'#111111'},{type:'solid',c1:'#f2ede4',c2:'#f2ede4'},
  {type:'grad',c1:'#f6d5c0',c2:'#c3d3f2'},{type:'grad',c1:'#fdf2c4',c2:'#f4a4a4'},{type:'grad',c1:'#0f2027',c2:'#2c5364'},{type:'grad',c1:'#d4f1e4',c2:'#a6c1ee'}
];

const $ = s => document.querySelector(s);
const cv = $('#cv'), stage = $('#stage'), tray = $('#tray'), sheet = $('#sheet'), modal = $('#modal');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');

let S = {ratio:'4:5', slides:3, bg:{type:'solid', c1:'#ffffff', c2:'#ffffff'}, items:[]};
const media = new Map(); // mediaId -> {id, kind, el, w, h, dur}; kept forever so undo can restore deleted items
const W = () => RATIOS[S.ratio][0], H = () => RATIOS[S.ratio][1];
let sel = null, cropMode = false, view = {x:0, y:0, z:.3}, guides = [], dirty = true, exporting = false;
let dpr = 1, SW = 0, SH = 0, fitted = false;
const getSel = () => S.items.find(i => i.id === sel) || null;
const frameOverride = new Map(); // mediaId -> exact decoded frame, used during export
let MB; const lib = () => MB ||= import('./vendor/mediabunny.min.mjs'); // video decode/encode, loaded only when needed
// Live <video> when it has a frame; otherwise a decoded poster (iOS often won't play hidden muted videos).
const srcOf = m => frameOverride.get(m.id) || (m.kind !== 'video' ? m.el : m.el.readyState >= 2 ? m.el : m.poster);

/* ---------- history ---------- */
let hist = [], fut = [], lastSaved = JSON.stringify(S);
function commit(){
  const now = JSON.stringify(S);
  if (now === lastSaved) return;
  hist.push(lastSaved); if (hist.length > 80) hist.shift();
  lastSaved = now; fut = []; updUI();
}
function undoRedo(from, to){
  commit(); if (!from.length) return;
  to.push(lastSaved); lastSaved = from.pop(); S = JSON.parse(lastSaved);
  if (!getSel()) { sel = null; cropMode = false; }
  closeSheet(false); updUI();
}

/* ---------- geometry ---------- */
function cover(mw, mh, w, h, fx, fy, zoom){
  const s = Math.max(w / mw, h / mh) * zoom, dw = mw * s, dh = mh * s;
  return {dx:(w - dw) * fx, dy:(h - dh) * fy, dw, dh};
}
function toLocal(it, px, py){
  const dx = px - it.x, dy = py - it.y, c = Math.cos(-it.rot), s = Math.sin(-it.rot);
  return [dx * c - dy * s, dx * s + dy * c];
}
function toWorld(it, lx, ly){
  const c = Math.cos(it.rot), s = Math.sin(it.rot);
  return [it.x + lx * c - ly * s, it.y + lx * s + ly * c];
}
function ext(it){ // half extents of the rotated box
  const c = Math.abs(Math.cos(it.rot)), s = Math.abs(Math.sin(it.rot));
  return {ex: it.w / 2 * c + it.h / 2 * s, ey: it.w / 2 * s + it.h / 2 * c};
}
function inSlide(it, i){
  const {ex, ey} = ext(it);
  return it.x + ex > i * W() + 1 && it.x - ex < (i + 1) * W() - 1 && it.y + ey > 0 && it.y - ey < H();
}
const world = (px, py) => [view.x + px / view.z, view.y + py / view.z];

/* ---------- text ---------- */
const mctx = document.createElement('canvas').getContext('2d');
const fontOf = it => `${it.weight} ${it.size}px ${FONTS[it.font] || FONTS.Sans}`;
function layoutText(it){
  mctx.font = fontOf(it);
  const lines = [];
  for (const para of it.text.split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (line && mctx.measureText(t).width > it.w) { lines.push(line); line = word; } else line = t;
    }
    lines.push(line);
  }
  it.h = Math.max(it.size * 1.2, lines.length * it.size * 1.2);
  return lines;
}

/* ---------- drawing ---------- */
function rrect(ctx, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawBg(ctx){
  const tw = S.slides * W();
  let f = S.bg.c1;
  if (S.bg.type === 'grad') { f = ctx.createLinearGradient(0, 0, tw, 0); f.addColorStop(0, S.bg.c1); f.addColorStop(1, S.bg.c2); }
  ctx.fillStyle = f; ctx.fillRect(0, 0, tw, H());
}
function drawItem(ctx, it, alpha = 1){
  ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.globalAlpha = it.opacity * alpha;
  if (it.type === 'text') {
    const lines = layoutText(it), lh = it.size * 1.2, w = it.w;
    ctx.font = fontOf(it); ctx.fillStyle = it.color; ctx.textBaseline = 'middle'; ctx.textAlign = it.align;
    const x = it.align === 'left' ? -w / 2 : it.align === 'right' ? w / 2 : 0;
    lines.forEach((l, i) => ctx.fillText(l, x, -it.h / 2 + lh * i + lh / 2));
  } else {
    const m = media.get(it.mediaId), w = it.w, h = it.h;
    const rad = it.radius / 100 * Math.min(w, h); // corners: % of the shorter side
    rrect(ctx, -w / 2, -h / 2, w, h, rad);
    const src = m && srcOf(m);
    if (!src) { ctx.fillStyle = '#d8d5ce'; ctx.fill(); }
    else {
      ctx.save(); ctx.clip();
      const c = cover(m.w, m.h, w, h, it.fx, it.fy, it.zoom);
      ctx.drawImage(src,-w / 2 + c.dx, -h / 2 + c.dy, c.dw, c.dh);
      ctx.restore();
    }
    if (it.borderW > 0) { // inner outline, % of the 1080 px slide width: double-width stroke clipped to the shape
      ctx.save(); rrect(ctx, -w / 2, -h / 2, w, h, rad); ctx.clip();
      ctx.lineWidth = it.borderW / 100 * W() * 2; ctx.strokeStyle = it.borderC; ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();
}
function renderSlide(ctx, i, s){
  ctx.setTransform(s, 0, 0, s, -i * W() * s, 0);
  ctx.imageSmoothingQuality = 'high';
  drawBg(ctx);
  for (const it of S.items) drawItem(ctx, it);
}
function handles(it){
  const w2 = it.w / 2, h2 = it.h / 2, list = [];
  for (const [hx, hy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) list.push({hx, hy, lx:hx * w2, ly:hy * h2});
  list.push({hx:1, hy:0, lx:w2, ly:0}, {hx:-1, hy:0, lx:-w2, ly:0});
  if (it.type !== 'text') list.push({hx:0, hy:-1, lx:0, ly:-h2}, {hx:0, hy:1, lx:0, ly:h2});
  list.push({rot:true, lx:0, ly:-h2 - 34 / view.z});
  return list;
}
function render(){
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#1c1d1f'; ctx.fillRect(0, 0, cv.width, cv.height);
  const z = view.z * dpr, px = 1 / view.z, w = W(), h = H(), tw = S.slides * w;
  ctx.setTransform(z, 0, 0, z, -view.x * z, -view.y * z);
  ctx.imageSmoothingQuality = 'high';
  for (const it of S.items) drawItem(ctx, it, .22); // faded parts hanging outside the carousel

// Frame-by-frame export: decode each source frame exactly, draw, encode. Not real-time, so no dropped frames or loop gaps.
async function exportVideosFrames(slides, dur, w, h, out, progress){
  const M = await lib(), BATCH = 4; // shortcut: 4 encoders at once to spare phone memory; raise if fine on device
  const aacOk = await M.canEncodeAudio('aac', {numberOfChannels:2, sampleRate:48000}).catch(() => false);
  for (const s of slides) for (const v of s.vids) await videoInput(media.get(v.mediaId));
  // each slide keeps its source frame rate (fastest clip on that slide); slides sharing a rate are rendered together
  const groups = [];
  for (const fps of [...new Set(slides.map(slideFps))]) { const g = slides.filter(s => slideFps(s) === fps); for (let b = 0; b < g.length; b += BATCH) groups.push({fps, batch:g.slice(b, b + BATCH)}); }
  let warned = false, done = 0;
  for (const {fps, batch} of groups) {
    const nF = Math.max(1, Math.round(dur * fps)), iters = new Map();
    const ms = [...new Set(batch.flatMap(s => s.vids.map(v => v.mediaId)))].map(id => media.get(id));
    for (const m of ms) {
      await videoInput(m);
      if (!m.vtrack) continue;
      // decode only as large as the biggest place this clip is drawn (a 4K clip in a 1080 slide needn't stay 4K)
      const need = Math.max(...S.items.filter(i => i.mediaId === m.id).map(i => cover(m.w, m.h, i.w, i.h, .5, .5, i.zoom).dw));
      const sink = new M.CanvasSink(m.vtrack, {width: Math.min(m.vtrack.displayWidth, Math.ceil(need / 2) * 2), poolSize:2});
      const md = m.dur || dur;
      iters.set(m.id, sink.canvasesAtTimestamps((function*(){ for (let n = 0; n < nF; n++) yield m.t0 + (n / fps) % md; })()));
    }
    const encs = [];
    for (const s of batch) {
      const c = mkCanvas(w, h), ctx = c.getContext('2d');
      const output = new M.Output({format:new M.Mp4OutputFormat({fastStart:'in-memory'}), target:new M.BufferTarget()});
      const vs = new M.CanvasSource(c, {codec:'avc', bitrate:16e6, keyFrameInterval:1});
      output.addVideoTrack(vs);
      let audio = null;
      const sounding = [...new Set(s.vids.filter(v => !v.muted).map(v => media.get(v.mediaId)))].filter(m => m.atrack);
      if (sounding.length && aacOk) { audio = new M.AudioBufferSource({codec:'aac', bitrate:192e3}); output.addAudioTrack(audio); audio.buf = await mixAudio(M, sounding, dur); }
      else if (sounding.length && !warned) { warned = true; toast('Exported without sound. This browser can’t encode audio.'); }
      await output.start();
      encs.push({s, ctx, output, vs, audio});
    }
    for (let n = 0; n < nF; n++) {
      for (const [id, it] of iters) { const r = (await it.next()).value; if (r) frameOverride.set(id, r.canvas); }
      for (const e of encs) { renderSlide(e.ctx, e.s.i, 1); await e.vs.add(n / fps, 1 / fps); }
      progress((done + (n + 1) / nF * batch.length) / slides.length);
    }
    for (const it of iters.values()) await it.return();
    for (const e of encs) {
      if (e.audio) await e.audio.add(e.audio.buf);
      await e.output.finalize();
      out[e.s.i] = {name:`slide-${pad(e.s.i + 1)}.mp4`, blob:new Blob([e.output.target.buffer], {type:'video/mp4'})};
    }
    done += batch.length; frameOverride.clear();
  }
}
const slideFps = s => Math.max(...s.vids.map(v => media.get(v.mediaId).fps || FPS));
async function mixAudio(M, ms, dur){
  const rate = 48000, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(2, Math.ceil(dur * rate), rate);
  for (const m of ms) {
    if (!m.achunks) { m.achunks = []; for await (const b of new M.AudioBufferSink(m.atrack).buffers()) m.achunks.push({t:b.timestamp - m.t0, buf:b.buffer}); }
    const md = m.dur || dur;
    for (let k = 0; k * md < dur; k++) for (const c of m.achunks) {
      if (c.t < 0 || c.t >= md || k * md + c.t >= dur) continue;
      const src = ctx.createBufferSource(); src.buffer = c.buf; src.connect(ctx.destination);
      src.start(k * md + c.t); src.stop((k + 1) * md); // cut at the loop point so loops don't overlap
    }
  }
  return ctx.startRendering();
}
async function exportVideos(slides, dur, w, h, mime, out, progress){
  const vids = [...new Set(slides.flatMap(s => s.vids.map(v => media.get(v.mediaId))))];
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); await actx.resume(); } catch { actx = null; }
  const recs = slides.map(s => {
    const c = mkCanvas(w, h), ctx = c.getContext('2d'), stream = c.captureStream(FPS);
    if (actx) {
      const dest = actx.createMediaStreamDestination(); let any = false;
      for (const it of s.vids) if (!it.muted) {
        const m = media.get(it.mediaId);
        try { if (!audioSrc.has(m.id)) audioSrc.set(m.id, actx.createMediaElementSource(m.el)); audioSrc.get(m.id).connect(dest); any = true; } catch {}
      }
      if (any) dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    }
    const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:16e6, audioBitsPerSecond:192e3}), chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    renderSlide(ctx, s.i, 1);
    return {s, ctx, rec, chunks};
  });
  const sounding = new Set(slides.flatMap(s => s.vids.filter(v => !v.muted).map(v => v.mediaId)));
  for (const m of vids) { m.el.pause(); m.el.currentTime = 0; m.el.muted = !(actx && sounding.has(m.id)); } // audio goes only into the recording graph, not the speakers
  await sleep(250);
  recs.forEach(r => r.rec.start(1000));
  await Promise.all(vids.map(m => m.el.play().catch(() => {})));
  const t0 = performance.now();
  await new Promise(res => (function frame(){
    const t = (performance.now() - t0) / 1000;
    recs.forEach(r => renderSlide(r.ctx, r.s.i, 1));
    progress(Math.min(1, t / dur));
    if (t >= dur) return res();
    requestAnimationFrame(frame);
  })());
  await Promise.all(recs.map(r => new Promise(res => { r.rec.onstop = res; r.rec.stop(); })));
  for (const m of vids) m.el.muted = true;
  for (const [id, src] of audioSrc) try { src.disconnect(); } catch {}
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  recs.forEach(r => out[r.s.i] = {name:`slide-${pad(r.s.i + 1)}.${ext}`, blob:new Blob(r.chunks, {type:mime.split(';')[0]})});
}
function showResults(out){
  const files = out.map(o => new File([o.blob], o.name, {type:o.blob.type}));
  const canShare = !!(navigator.canShare && navigator.canShare({files}));
  modal.querySelector('h2').textContent = `${out.length} slide${out.length > 1 ? 's' : ''} ready`;
  modal.querySelector('.panel .cap').textContent = 'Post them in this order.';
  modal.querySelector('.prog').hidden = true; $('#pstat').textContent = '';
  $('#res').innerHTML = out.map((o, i) => { const u = URL.createObjectURL(o.blob); o.url = u;
    return `<a href="${u}" download="${o.name}">${o.blob.type.startsWith('video') ? `<video src="${u}" muted loop autoplay playsinline></video>` : `<img src="${u}" alt="Slide ${i + 1}">`}<span>${i + 1}</span></a>`; }).join('');
  $('#ebtns').innerHTML = `<button class="btn${canShare ? ' quiet' : ''}" id="edl">Download</button>${canShare ? '<button class="btn" id="eshare">Save to Photos</button>' : ''}`;
  $('#edl').onclick = async () => { for (const o of out) { const a = document.createElement('a'); a.href = o.url; a.download = o.name; a.click(); await sleep(350); } };
  if (canShare) $('#eshare').onclick = () => navigator.share({files}).catch(e => { if (e.name !== 'AbortError') toast('Couldn’t open sharing. Use Download instead.'); });
}

/* ---------- self-check (open with #test) ---------- */
function selfTest(){
  const a = (c, m) => { if (!c) throw new Error('selftest failed: ' + m); };
  a(RATIOS['1:1'].join() === '1080,1080' && RATIOS['4:5'].join() === '1080,1350' && RATIOS['3:4'].join() === '1080,1440', 'instagram sizes');
  const c = cover(2000, 1000, 1080, 1350, .5, .5, 1);
  a(Math.abs(c.dh - 1350) < 1e-6 && c.dw >= 1080 && Math.abs(c.dx - (1080 - c.dw) / 2) < 1e-6, 'cover crop');
  const it = {x:100, y:100, w:200, h:100, rot:Math.PI / 2}, [lx, ly] = toLocal(it, 100, 190);
  a(Math.abs(lx - 90) < 1e-6 && Math.abs(ly) < 1e-6, 'toLocal');
  const [wx, wy] = toWorld(it, lx, ly); a(Math.abs(wx - 100) < 1e-6 && Math.abs(wy - 190) < 1e-6, 'toWorld round-trip');
  const box = {x:1080, y:600, w:400, h:400, rot:0}; a(inSlide(box, 0) && inSlide(box, 1) && !inSlide(box, 2), 'seam spans two slides');
  a(edgeSnap(0, 1, 1075, [1080], [], 10).len === 1080 && edgeSnap(100, -1, 500, [], [505], 10).len === 505 && !edgeSnap(0, 1, 900, [1080], [], 10), 'edge/size snapping');
  console.log('selftest ok'); return 'ok';
}
